# Serving the demo pages straight out of a container.
#
# `charset utf-8` is not decoration. `console.html` is authored as an Artifact page, where the
# publish skeleton supplies the doctype and the charset; served raw by nginx nothing does, and
# without this line the browser guesses, every em dash becomes mojibake, and the page looks
# broken in a way that has nothing to do with the page. The file declares its own charset too —
# two declarations of the same encoding, because this one also covers .js and .css.
server {
  listen 80;
  server_name _;
  charset utf-8;
  charset_types text/html text/css application/javascript application/json image/svg+xml;

  root /usr/share/nginx/html;
  index console.html index.html;

  # The pages are planning tools, not assets with content hashes: a stale one gives wrong
  # answers with total confidence, so they are revalidated rather than cached.
  add_header Cache-Control "no-cache";
  add_header X-Content-Type-Options "nosniff";

  location = /healthz { access_log off; return 200 "ok\n"; }
}
